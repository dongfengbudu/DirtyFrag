name: Sync upstream & localize

on:
  schedule:
    # UTC 21:17 = Beijing 05:17, off the on-the-hour stampede.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write # push the merge + localization commits
  issues: write # conflict notification
  actions: write # dispatch Build (GITHUB_TOKEN pushes don't trigger workflows)

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        id: upstream
        run: |
          git remote add upstream https://github.com/diabl0w/DFRoot.git
          git fetch upstream
          git remote set-head upstream --auto
          branch="$(git rev-parse --abbrev-ref upstream/HEAD)"
          branch="${branch#upstream/}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "behind=$(git rev-list --count HEAD..upstream/$branch)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        if: steps.upstream.outputs.behind != '0'
        id: merge
        continue-on-error: true
        run: |
          if git merge --no-commit --no-ff "upstream/${{ steps.upstream.outputs.branch }}"; then
            # The fork owns its CI: upstream commits touch .github/workflows,
            # and a push that updates a workflow file is rejected without the
            # workflows permission (which a workflow file cannot grant). Drop
            # upstream's .github and keep the fork's own.
            git rm -rq .github 2>/dev/null || true
            git checkout HEAD -- .github/ 2>/dev/null || true
            git commit -m "Merge upstream diabl0w/DFRoot@$(git rev-parse --short upstream/${{ steps.upstream.outputs.branch }})"
          else
            exit 1
          fi

      # No conflicts: rebuild the localization layer and push back. A
      # GITHUB_TOKEN push does not trigger other workflows (anti-recursion),
      # so Build is dispatched explicitly at the end.
      - name: Re-apply localization and push
        if: steps.upstream.outputs.behind != '0' && steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make localize
          git add -A
          if git diff --cached --quiet; then
            echo "localize: nothing to commit"
          else
            git commit -m "chore(i18n): re-apply Chinese localization after upstream sync"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # gh workflow run resolves the repo from git remotes; with origin +
          # upstream present it can pick the wrong one. Call the API directly.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" -f ref="${GITHUB_REF_NAME}"

      # Conflicts: a machine cannot resolve them. Opening an issue needs no
      # push at all (pushing an upstream branch is rejected: its commits touch
      # workflow files, and a cross-repo head=upstream:branch PR needs
      # permission on the head repo).
      - name: Open issue on conflicts
        if: steps.upstream.outputs.behind != '0' && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(git diff --name-only --diff-filter=U | sed 's/^/- /')"
          git merge --abort || true
          title="Upstream sync conflict needs manual resolution"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '[.[] | select(.title == "Upstream sync conflict needs manual resolution")] | length')"
          if [ "$existing" != "0" ]; then
            echo "conflict issue already open"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues" \
            -f title="$title" \
            -f body="$(printf '上游 diabl0w/DFRoot 有新提交，与汉化 fork 的改动冲突，机器无法自动解决。\n\n冲突文件：\n%s\n\n解决步骤（本地）：\n1. git fetch origin && git checkout master && git pull\n2. git remote add upstream https://github.com/diabl0w/DFRoot.git （如未添加）\n3. git fetch upstream && git merge upstream/master\n4. 解决上面列出的冲突\n5. make localize\n6. git add -A && git commit && git push' "$files")"
          exit 1
